version: 2

models:
  - name: int_orders_checked
    columns:
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - France
                  - Germany
                  - Italy
                  - Morocco
                  - Tunisia
      - name: order_id
        data_tests:
          - unique:
              config:
                where: "reject_reason IS NULL"
